services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_change_me}
      KC_HOSTNAME: http://keycloak.localhost:8080
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-devops}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-devops_local}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - keycloak.localhost

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_local}
      POSTGRES_DB: ${POSTGRES_DB:-devops_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops} -d ${POSTGRES_DB:-devops_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-devops}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devops_local}
    command:
      - sh
      - -ec
      - |
        if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'")" != "1" ]; then
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE keycloak';
        fi
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-devops_platform};Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops_local}
      FrontendOrigin: http://localhost:${FRONTEND_PORT:-3000}
      SeedDemo: "true"
      Oidc__Issuer: http://keycloak.localhost:8080/realms/devops
      Oidc__Audience: devops-api
      AzureDevOps__Pat: ${AZURE_DEVOPS_PAT:-}
      AzureEntra__TenantId: ${AZURE_ENTRA_TENANT_ID:-}
      AzureEntra__ClientId: ${AZURE_ENTRA_CLIENT_ID:-}
      AzureEntra__ClientSecret: ${AZURE_ENTRA_CLIENT_SECRET:-}
      GitHubApp__Slug: ${GITHUB_APP_SLUG:-}
      GitHubApp__AppId: ${GITHUB_APP_ID:-}
      GitHubApp__ClientId: ${GITHUB_APP_CLIENT_ID:-}
      GitHubApp__ClientSecret: ${GITHUB_APP_CLIENT_SECRET:-}
      GitHubApp__PrivateKey: ${GITHUB_APP_PRIVATE_KEY:-}
      ProviderOAuth__CallbackUrl: http://localhost:${BACKEND_PORT:-5000}/api/integrations/oauth/callback
      DataProtection__KeysPath: /app/keys
    volumes:
      - backend_keys:/app/keys
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ENABLE_DEMO: ${NEXT_PUBLIC_ENABLE_DEMO:-true}
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_KEYCLOAK_ID: devops-web
      AUTH_KEYCLOAK_SECRET: devops-local-only
      AUTH_KEYCLOAK_ISSUER: http://keycloak.localhost:8080/realms/devops
      API_INTERNAL_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  backend_keys:
